services:
  health-and-med.mq:
    container_name: health-and-med.mq
    image: 'rabbitmq:3.11.7-management'
    environment:
      - RABBIT_DEFAULT_USER=guest
      - RABBIT_DEFAULT_PASS=guest
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - './rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf'
